[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-study-harvester"
version = "0.1.0"
description = "Categorized bulk downloader for legally open scholarly papers and public-domain / free-licensed ebooks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["PySide6>=6.6"]
build = ["PySide6>=6.6", "pyinstaller>=6.3"]

[project.scripts]
harvester = "harvester.cli:main"

[project.gui-scripts]
harvester-gui = "harvester.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harvester = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: tests that hit real network endpoints (deselect with -m 'not live')",
]
